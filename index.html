<script>const APP_DATA = {"generated": "2026-06-03", "recipes": [{"name": "Marry Me Chicken Casserole", "cuisine": "American", "protein": "chicken", "meal_type": "dinner", "effort": "involved", "url": "https://www.sustainablecooks.com/marry-me-chicken-casserole/", "ingredients": "2 cups dry rotini noodles; 1 lb boneless skinless chicken breasts, cubed into ~1-inch pieces; 3/4 tsp kosher salt; 1/2 tsp ground black pepper; 1/2 tsp dried oregano; 1/2 tsp dried basil; 1/8 tsp smoked paprika; 1 tbsp olive oil; 1/4 cup salted butter; 3 cloves garlic, finely minced; 1/3 cup sundried tomatoes, finely chopped; 1 cup chicken stock; 1 1/4 cup heavy cream; 1 tbsp sundried tomato oil (optional); 2 tbsp pesto; 1 1/3 cup shredded parmesan, divided", "instructions": "1. Preheat oven to 350F.\n2. Bring 3 quarts salted water to a boil in a large saucepan.\n3. Cook rotini until al dente (~7 minutes); drain, reserving 1/4 cup pasta water.\n4. Season cubed chicken with salt, pepper, oregano, basil, and smoked paprika.\n5. Heat olive oil in an oven-safe skillet over medium heat.\n6. Add chicken and cook until just cooked through (~5-6 minutes); transfer to a plate.\n7. Drain pan juices, then melt butter over low heat.\n8. Stir in minced garlic and sundried tomatoes; cook 2-3 minutes.\n9. Slowly whisk in chicken stock, heavy cream, sundried tomato oil, and pesto.\n10. Increase heat to medium-high; bring to a low boil for 3 minutes while whisking.\n11. Stir in 1 cup parmesan until incorporated.\n12. Add the cooked pasta and chicken; combine.\n13. Top with the remaining 1/3 cup parmesan.\n14. Bake uncovered at 350F for 10 minutes until the cheese melts and browns lightly.", "notes": "creamy, rich, viral", "added": "2026-06-03", "image": "https://www.sustainablecooks.com/wp-content/uploads/2025/05/Marry-Me-Chicken-Casserole-1.jpg"}, {"name": "Sheet-Pan Balsamic Rosemary Chicken Thighs & Potatoes", "cuisine": "American", "protein": "chicken", "meal_type": "dinner", "effort": "quick", "url": "https://recipeteacher.com/sheet-pan-chicken-quarters-and-potatoes-rosemary-balsamic/", "ingredients": "4 chicken quarters; 4 sprigs fresh rosemary; 1/2 cup balsamic vinegar; 1/4 cup chicken stock; 1 tbsp malt vinegar; 1 tbsp brown sugar; 1 tbsp fresh rosemary, chopped; 1 tbsp flat leaf parsley, chopped; 1 tbsp olive oil; salt to taste; 6 small/medium russet potatoes; 3 tbsp fresh chopped rosemary; 2 tbsp balsamic vinegar; 2 tbsp olive oil; 2 tbsp minced garlic; 2 tbsp chopped flat leaf parsley; 1 tsp onion powder; 1 tsp garlic powder; salt and pepper to taste", "instructions": "1. Preheat oven to 425F.\n2. Line a large baking sheet with foil or parchment paper.\n3. Arrange chicken quarters on the sheet, tuck a rosemary sprig under the skin of each quarter, and brush with olive oil and salt.\n4. Peel the potatoes and cut into wedges.\n5. Mix all potato ingredients in a bowl and coat the wedges thoroughly, then arrange on the sheet pan around the chicken; bake 40 minutes.\n6. Combine the remaining chicken ingredients (balsamic vinegar, chicken stock, malt vinegar, brown sugar, chopped rosemary, parsley, olive oil) in a small pot and simmer over low heat.\n7. At the 20-minute mark, remove the pan and brush the chicken with the balsamic mixture, then return to the oven.\n8. After 40 minutes total, remove the pan, cool 5 minutes, and drizzle the remaining sauce over the chicken before serving.", "notes": "10 min prep, hands-off", "added": "2026-06-03", "image": "https://recipeteacher.com/wp-content/uploads/2018/10/sheet-pan-balsamic-rosemary-chicken-quarters.jpg"}, {"name": "Hamburger Steak with Onion Gravy", "cuisine": "American", "protein": "beef", "meal_type": "dinner", "effort": "quick", "url": "https://www.restlesschipotle.com/hamburger-steak/", "ingredients": "2 lb lean ground beef; 1 egg; 1/4 cup Worcestershire sauce; 1/3 cup breadcrumbs; 1/3 cup milk; 1 tsp seasoned salt; 1 tsp onion powder; 2 tsp garlic powder; 1 onion, sliced; 1/4 cup butter; 1/3 cup all-purpose flour; 2 cups beef broth", "instructions": "1. Combine all patty ingredients (ground beef, egg, Worcestershire, breadcrumbs, milk, seasoned salt, onion powder, garlic powder) in a bowl and mix thoroughly by hand.\n2. Form the mixture into 6 patties.\n3. Spray a heavy skillet with nonstick cooking spray.\n4. Brown each patty over medium-high heat for about 3 minutes per side.\n5. Remove the patties and set aside.\n6. Add the sliced onions to the same pan, with extra oil if needed.\n7. Saute until the onions begin to brown.\n8. Add the butter and let it melt.\n9. Whisk in the flour until no longer visible.\n10. Cook while whisking constantly for 1 minute.\n11. Whisk in the beef broth until no lumps remain.\n12. Bring to a simmer, whisking until thickened.\n13. Taste and adjust seasoning as needed.\n14. Return the beef patties to the gravy.\n15. Set heat to medium-low, cover, and simmer 20-30 minutes until the patties reach 160F internally.\n16. Remove from heat, cover, and let stand 5-10 minutes before serving.", "notes": "hearty budget comfort", "added": "2026-06-03", "image": "https://www.restlesschipotle.com/wp-content/uploads/2022/03/hamburger-steak-feat.jpg"}, {"name": "Slow-Roasted BBQ Pulled Pork", "cuisine": "American", "protein": "pork", "meal_type": "dinner", "effort": "involved", "url": "https://thefoodcharlatan.com/pulled-pork-slow-cooker/", "ingredients": "5-7 lb pork butt or pork shoulder, bone-in preferred; 3 tbsp olive oil; 1 tsp liquid smoke (optional); 2 tbsp vegetable oil for searing; 1 tbsp kosher salt (or 2 1/2 tsp table salt); 2 tsp black pepper; 1 tbsp paprika; 2 tsp garlic powder; 2 tsp onion powder; 1 tsp chili powder; 1 tsp cayenne pepper; 2 tsp cumin; 1 tsp dry mustard powder; 1/3 cup packed brown sugar; barbecue sauce, for serving; brioche hamburger buns, for serving; softened butter, for serving; coleslaw, for serving", "instructions": "1. Split the pork butt into 3 equal pieces to speed cooking and maximize browned surfaces.\n2. Pat the pork dry and rub with 3 tbsp olive oil and the liquid smoke; apply all but 3 tbsp of the spice rub (salt, pepper, paprika, garlic powder, onion powder, chili powder, cayenne, cumin, dry mustard, brown sugar), working it into every crevice. Seal in a ziplock bag and marinate 6-48 hours refrigerated.\n3. Remove the pork and let it sit at room temperature for about 1 hour before cooking.\n4. Preheat oven to 425F for at least 20 minutes.\n5. Set an oven-safe wire cooling rack over a rimmed baking sheet and spray with nonstick coating; add 1 1/2 cups water to the pan bottom for humidity. Place the pork pieces on the rack fat caps up, not touching.\n6. Apply the remaining 3 tbsp spice rub to the pieces.\n7. Roast at 425F for 30 minutes to sear the edges and develop browning.\n8. Lower the oven to 300F, briefly opening the door (30-60 seconds) to cool the interior before continuing.\n9. Continue roasting at 300F for 3-5 hours, monitoring the water level and adding more as needed.\n10. Check internal temperature around the 3-hour mark; target 195-200F and remove at 200F (temperature continues rising after removal).\n11. Rest the pork 15-20 minutes, tented with foil, on a cutting board.\n12. Shred with two forks until completely separated, retaining rendered fat for flavor and discarding only gristle; serve with barbecue sauce on buttered brioche buns with coleslaw.", "notes": "low and slow, great leftovers", "added": "2026-06-03", "image": "https://thefoodcharlatan.com/wp-content/uploads/2022/07/Pulled-Pork-Recipe-Slow-Cooker-or-Oven-Roasted-22.jpg"}, {"name": "Garlic Herb Butter Grilled Steak", "cuisine": "American", "protein": "beef", "meal_type": "dinner", "effort": "quick", "url": "https://cafedelites.com/grilling-steak/", "ingredients": "4 steaks (ribeye, strip, porterhouse, T-bone, rump, sirloin, or eye fillet); 1/2 cup unsalted butter; 6-8 cloves garlic, smashed; 2 sprigs fresh herbs (thyme or rosemary); 1/2-1 tsp cracked pepper; salt to taste; pepper to taste; 2 tbsp cooking oil (canola recommended)", "instructions": "1. Remove the steaks from the refrigerator 15-30 minutes before grilling and cover with wrap or foil.\n2. Melt the butter in a small pot or skillet on the grill over medium-high heat, stirring continuously to prevent splattering.\n3. When the butter foams and turns golden brown with a nutty aroma, remove from heat immediately.\n4. Add the smashed garlic cloves, herb sprigs, pepper, and salt; mix lightly to brown the garlic and incorporate the browned bits.\n5. Cover and set the browned butter aside to absorb the garlic and herb flavors.\n6. Heat the grill over high heat and lightly grease the grill plates with oil; pat the steaks dry, brush with oil, and season generously with salt and pepper.\n7. Grill the steaks 4-5 minutes per side until browned and cooked to desired doneness, spooning browned butter over them during cooking.\n8. Transfer the steaks to a warm plate and rest 5 minutes, then serve with the remaining browned butter drizzled over top.", "notes": "simple, rich", "added": "2026-06-03", "image": "https://cafedelites.com/wp-content/uploads/2020/06/Grilled-Steak-Browned-Butter-Sauce-IMAGE-41.jpg"}, {"name": "Thai Basil Chicken (Pad Kra Pao)", "cuisine": "Asian", "protein": "chicken", "meal_type": "dinner", "effort": "quick", "url": "https://thewoksoflife.com/thai-basil-chicken-pad-krapow/", "ingredients": "3 to 4 tbsp oil; 3 Thai bird chilies or Holland chilies, thinly sliced (de-seeded if desired); 3 shallots, thinly sliced; 5 cloves garlic, sliced; 1 pound ground chicken; 2 tsp sugar (or honey); 2 tbsp soy sauce; 1 tbsp fish sauce; 1/3 cup low sodium chicken broth (or water); 1 bunch holy or Thai basil leaves; 3 eggs, fried (for serving)", "instructions": "1. In a wok over high heat, add the oil, chilies, shallots and garlic, and fry for 1-2 minutes.\n2. Add the ground chicken and stir-fry for 2 minutes, breaking up the chicken into small bits.\n3. Add the sugar, soy sauce, and fish sauce. Stir-fry for another minute and deglaze the pan with the broth.\n4. Add the basil and stir-fry until wilted. Serve over rice, traditionally topped with a fried egg.", "notes": "under 30 min, fried egg on top", "added": "2026-06-03", "image": "https://thewoksoflife.com/wp-content/uploads/2016/06/thai-basil-chicken-7.jpg"}, {"name": "Thai Cashew Chicken", "cuisine": "Asian", "protein": "chicken", "meal_type": "dinner", "effort": "quick", "url": "https://www.recipetineats.com/thai-cashew-chicken-stir-fry/", "ingredients": "2 tbsp canola or vegetable oil; 1/2 cup raw unsalted cashews; 1 garlic clove, finely minced; 1/2 onion (brown, yellow or white), cut into thin wedges; 200g/7oz boneless skinless chicken thighs, sliced into 1cm/1/3 inch thin strips; 2 green onions, cut into 2.5cm/1 inch lengths, white and green parts separated; 1/2 red cayenne pepper, deseeded and finely sliced on the diagonal (optional); 1 tbsp oyster sauce; 1 tsp dark soy sauce; 2 tsp fish sauce; 1 tsp white sugar; 3 tbsp water; jasmine rice and extra sliced red chilli, to serve", "instructions": "1. Mix all sauce ingredients (oyster sauce, dark soy sauce, fish sauce, sugar, water) in a small bowl.\n2. Heat oil over medium heat in a wok or large skillet. Add cashews and cook for 5 minutes until dark golden and crunchy, then remove with a slotted spoon.\n3. Turn heat to high. Add garlic and onion and cook for 30 seconds.\n4. Add chicken and cook for 1 minute until the exterior turns from pink to white.\n5. Add the white part of the green onions and the chilli and cook for 1 minute until chicken is cooked through.\n6. Pour in the sauce and cook for 1 minute until it reduces to a syrup coating the chicken.\n7. Add the green part of the green onions and the cashews and toss for 30 seconds.\n8. Transfer to a serving dish and serve with jasmine rice, garnished with extra red chilli if desired.", "notes": "beats takeout", "added": "2026-06-03", "image": "https://www.recipetineats.com/tachyon/2021/04/Thai-Cashew-Chicken_9.jpg"}, {"name": "Pad See Ew", "cuisine": "Asian", "protein": "chicken", "meal_type": "dinner", "effort": "quick", "url": "https://www.recipetineats.com/thai-stir-fried-noodles-pad-see-ew/", "ingredients": "200g/7oz dried wide rice stick noodles (or 450g/15oz fresh wide flat rice noodles); 2 tsp dark soy sauce; 1 1/2 tbsp oyster sauce; 1 tbsp light soy sauce; 2 tsp white vinegar; 2 tsp sugar; 3 tbsp vegetable oil (separated); 2 cloves garlic, very finely chopped; 1 cup/150g/5oz boneless skinless chicken thighs, sliced; 1 large egg; 4 stems Chinese broccoli (gai lan)", "instructions": "1. Trim the Chinese broccoli ends and cut into 3-inch pieces; separate leaves from stems and halve thick stems vertically to about 0.3 inches thick.\n2. Prepare noodles per packet directions and drain immediately.\n3. Mix the sauce ingredients until the sugar dissolves.\n4. Heat 1 tbsp oil in a large heavy skillet or wok over high heat.\n5. Add garlic and cook 15 seconds, then add chicken and cook until mostly white.\n6. Add Chinese broccoli stems and cook until chicken is nearly cooked through.\n7. Add Chinese broccoli leaves and cook until wilted.\n8. Push contents to one side, crack the egg into the wok and scramble quickly.\n9. Remove all ingredients onto a plate and wipe the wok clean.\n10. Return wok to high heat with 2 tbsp oil until smoking, then add noodles and sauce.\n11. Toss minimally for 1-1 1/2 minutes until sauce disperses and noodle edges caramelize.\n12. Quickly add the chicken and vegetables back in, toss briefly and serve immediately.", "notes": "wide rice noodles, sweet soy", "added": "2026-06-03", "image": "https://www.recipetineats.com/tachyon/2016/03/Pad-See-Ew-Thai-Noodles_3.jpg"}, {"name": "Beef and Broccoli Stir-Fry", "cuisine": "Asian", "protein": "beef", "meal_type": "dinner", "effort": "quick", "url": "https://www.recipetineats.com/chinese-beef-and-broccoli-extra-saucy-take-out-style/", "ingredients": "2 tbsp cornstarch/cornflour; 1/4 cup water (for sauce); 1 tsp sugar; 1 tbsp dark soy sauce; 1 1/2 tbsp light soy sauce; 1 tbsp Chinese cooking wine (Shaoxing wine); 1/8 tsp Chinese five spice powder; 1 tsp sesame oil (optional); 1/8 tsp black pepper; 2 tbsp oil; 12 oz (360g) beef fillet, flank, or rump; 1 garlic clove, finely chopped; 1 tsp fresh ginger, finely chopped; 4-5 cups broccoli florets (1 head); 1 cup water; sesame seeds, to serve (optional)", "instructions": "1. Combine cornflour and water in a bowl, then add the remaining sauce ingredients and mix.\n2. Slice beef into 1/4 inch (0.5cm) thick slices. Place beef and 2 tbsp of the sauce in a bowl and set aside.\n3. Heat oil in a skillet over high heat. Add beef in a single layer and leave 1 minute until browned.\n4. Stir beef for 10 seconds, then add garlic and ginger and stir another 30 seconds until beef loses its pink color.\n5. Pour the sauce and water into the skillet and mix quickly.\n6. When the sauce bubbles, add broccoli. Stir to coat, then simmer 1 minute until the sauce thickens.\n7. Remove from heat immediately and serve over rice. Garnish with sesame seeds if desired.", "notes": "savory, under 30 min", "added": "2026-06-03", "image": "https://www.recipetineats.com/tachyon/2015/03/Chinese-Beef-and-Broccoli_3.jpg"}, {"name": "Honey Garlic Shrimp", "cuisine": "Asian", "protein": "seafood", "meal_type": "dinner", "effort": "quick", "url": "https://sallysbakingaddiction.com/quick-healthy-dinner-20-minute-honey-garlic-shrimp/", "ingredients": "1/3 cup honey; 1/4 cup soy sauce (reduced sodium recommended); 2 garlic cloves, minced (or 1 tsp jarred minced garlic); 1 tsp minced fresh ginger (optional); 1 lb medium uncooked shrimp, peeled and deveined; 2 tsp olive oil; chopped green onion, for garnish (optional)", "instructions": "1. Whisk together the honey, soy sauce, garlic, and ginger (if using) in a medium bowl. Divide the mixture in half (one portion for marinating and one for cooking).\n2. Place shrimp in a large sealable container or zip-top bag. Pour half the marinade over the shrimp, shake or stir to coat, then refrigerate for 15 minutes or up to 8-12 hours. Cover and refrigerate the remaining marinade for step 3.\n3. Heat olive oil in a skillet over medium-high heat. Add shrimp (discard used marinade). Cook on one side until pink, about 45 seconds, then flip. Pour in the remaining marinade and cook until shrimp is cooked through, about 1-2 additional minutes.\n4. Serve shrimp with the cooked sauce and garnish with green onion. Pairs well with brown rice and steamed vegetables.", "notes": "occasional seafood night", "added": "2026-06-03", "image": "https://sallysbakingaddiction.com/wp-content/uploads/2016/05/honey-garlic-shrimp-5.jpg"}, {"name": "Vietnamese Chicken & Cabbage Salad", "cuisine": "Asian", "protein": "chicken", "meal_type": "dinner", "effort": "quick", "url": "https://www.recipetineats.com/vietnamese-chicken-salad/", "ingredients": "350g/12oz cooked chicken, cut into thin batons; 6 heaped cups wombok (Napa) cabbage, finely shredded; 1/2 red onion, very finely sliced; 1 red capsicum/bell pepper, finely sliced into thin batons; 2 cucumbers, seeds removed, finely sliced into half moons; 1 large carrot, peeled and julienned; 1 large chilli, deseeded and julienned (optional); 1 cup tightly packed mint leaves, large leaves roughly torn; 1 cup tightly packed coriander/cilantro leaves; 1/2 cup roasted sunflower seeds, finely chopped (allergy-safe swap); 2 tbsp lime juice; 2 tbsp rice vinegar; 1/4 cup fish sauce; 1/4 cup canola oil; 1 tbsp white sugar; 1 large garlic clove, very finely minced; 2 tsp red chilli, deseeded and very finely minced", "instructions": "1. Dressing: Shake all dressing ingredients in a jar. Set aside 10 minutes to allow the flavours to meld.\n2. Place all salad ingredients in a very large bowl. Pour over half the dressing and toss well. Set aside 5 minutes so the vegetables soften slightly into a more slaw-like texture.\n3. Just before serving, toss again then add most of the remaining dressing. Taste and add more dressing if desired.\n4. Serve sprinkled with lots of chopped roasted sunflower seeds (allergy-safe swap).", "notes": "light, crunchy, fresh", "added": "2026-06-03", "image": "https://www.recipetineats.com/tachyon/2020/11/Vietnamese-Chicken-Salad_2.jpg"}, {"name": "Chicken Burrito Bowls", "cuisine": "Mexican", "protein": "chicken", "meal_type": "dinner", "effort": "quick", "url": "https://www.budgetbytes.com/easiest-burrito-bowl-meal-prep/", "ingredients": "4 cups cooked rice; 1 lb ground turkey or beef; 1 packet taco seasoning; 1 cup frozen corn kernels; 1 15oz can black beans; 4 oz cheese (about 1 cup shredded); 1 1/3 cup salsa; 2 green onions", "instructions": "1. Cook the rice first according to package directions (about 1.5 cups uncooked rice with 2.5 cups water yields about 4 cups cooked white rice; adjust for your rice variety).\n2. While the rice cooks, add the ground turkey or beef to a skillet and cook over medium heat until cooked through, adding oil if needed to prevent sticking.\n3. Once the meat is fully cooked, add the taco seasoning and 1/2 cup water. Stir and simmer until the water reduces to a saucy consistency, about 5 minutes, then turn off the heat and set aside.\n4. Thaw the corn, rinse and drain the black beans, shred the cheese, and slice the green onions.\n5. Fluff the cooked rice with a fork and divide between four containers. Divide the meat, corn, beans, cheese, salsa, and green onions evenly between the containers.\n6. Reheat each bowl for 1-2 minutes before eating to melt the cheese and heat the meat and rice through.", "notes": "customizable, meal-preps well", "added": "2026-06-03", "image": "https://www.budgetbytes.com/wp-content/uploads/2018/04/Easiest-Burrito-Bowl-Meal-Prep-H2.jpg"}, {"name": "Skirt Steak with Chimichurri", "cuisine": "Mexican", "protein": "beef", "meal_type": "dinner", "effort": "quick", "url": "https://www.recipetineats.com/skirt-steak-with-chimichurri-sauce/", "ingredients": "700g/1.4lb skirt, flank, or flat iron steak, at room temperature; salt and pepper, to season; 1 cup parsley leaves, tightly packed; 1 tbsp oregano leaves, tightly packed; 4 garlic cloves, minced; 0-2 tsp red pepper flakes (optional); 1/4 cup (65ml) red wine vinegar; 1/2 tsp salt; black pepper; 1/2 cup (125ml) extra virgin olive oil; 1 tbsp vegetable or canola oil (for cooking)", "instructions": "1. Place all chimichurri ingredients except the oil in a food processor. Whizz until the parsley is finely chopped but not pureed (or chop by hand).\n2. Transfer to a small bowl, add the olive oil and gently stir. Set aside for 1 hour before using (overnight is even better). Makes about 3/4 cup.\n3. Take the steak out of the fridge 30 minutes before cooking.\n4. Heat a BBQ or heavy-based skillet with 1 tbsp vegetable or canola oil over high heat until smoking.\n5. Sprinkle each side of the steak generously with salt and pepper.\n6. Add the steak and cook to your liking: 2 minutes each side for medium rare, or 2 1/2 minutes each side for medium.\n7. Transfer to a plate, cover loosely with foil and rest for 5-10 minutes.\n8. Cut thin slices against the grain and serve with the chimichurri sauce on the side.", "notes": "bold, fresh", "added": "2026-06-03", "image": "https://www.recipetineats.com/tachyon/2016/08/Steak-with-Chimichurri-Sauce_1.jpg"}, {"name": "Chicken Quesadillas", "cuisine": "Mexican", "protein": "chicken", "meal_type": "dinner", "effort": "quick", "url": "https://www.recipetineats.com/oven-baked-chicken-quesadillas/", "ingredients": "400g/14oz chicken, cut into small bite-size pieces; 1 tsp cumin powder; 1 tsp garlic powder; 1/2 tsp cayenne pepper; 1 tsp paprika powder; 1/2 tsp salt plus black pepper; 1 tbsp olive oil (for chicken); 1 tbsp olive oil (for filling); 1/2 small onion, diced; 1 garlic clove, minced; 1 red capsicum/bell pepper, diced; 1 green capsicum/bell pepper, diced; 4 flour tortillas (20cm/8 inch); olive oil spray; 1 cup grated cheese (cheddar, tasty, or Monterey Jack)", "instructions": "1. Combine the chicken with cumin, garlic powder, cayenne, paprika, salt and pepper in a bowl.\n2. Heat 1 tbsp oil in a skillet over high heat. Add the onion and garlic and cook 1 minute, then add the capsicum and cook 2 minutes until softening. Transfer to a bowl.\n3. Return the skillet to the stove, add the chicken and cook until browned. Add to the vegetable mixture and cool completely (refrigerate to speed this up).\n4. Preheat oven to 220C/430F (standard) or 200C/390F (fan).\n5. Spray a baking tray with olive oil and heat it in the oven while you assemble the quesadillas.\n6. Divide the filling between the tortillas, covering half the surface of each. Top with cheese, fold in half and press gently but firmly.\n7. Remove the hot tray from the oven and transfer the quesadillas onto it (you should hear a soft sizzle).\n8. Bake 8 minutes, then flip each quesadilla over the folded edge, press with a spatula, and bake another 8 minutes until crispy.\n9. Serve immediately.", "notes": "fast, familiar", "added": "2026-06-03", "image": "https://www.recipetineats.com/tachyon/2016/12/Baked-Chicken-Quesadillas-7.jpg"}, {"name": "Turkey Bolognese", "cuisine": "Italian", "protein": "poultry", "meal_type": "dinner", "effort": "involved", "url": "https://www.skinnytaste.com/turkey-bolognese/", "ingredients": "1 pound 93% ground turkey; 1 teaspoon kosher salt; 1/2 tablespoon extra virgin olive oil; 1/2 yellow onion, chopped; 1 medium carrot, peeled and chopped; 1 celery rib, chopped; 2 tablespoons tomato paste; 1 clove garlic, minced; 10 ounces uncooked mezze rigatoni or fusilli pasta; 1 1/2 cups canned crushed tomatoes; 2 1/2 cups chicken bone broth; 1 teaspoon Calabrian chili paste (optional); 1/4 cup freshly grated parmesan cheese, plus more for garnish; fresh basil for garnish; ricotta (optional for serving)", "instructions": "1. Brown the ground turkey with the salt in a large deep skillet over medium-high heat until no longer pink, 5-7 minutes, then set aside.\n2. Add the olive oil, onion, carrot, and celery; cook until softened, about 5 minutes.\n3. Stir in the tomato paste and garlic; cook a few minutes until fully coated.\n4. Add the pasta, cooked turkey, crushed tomatoes, bone broth, and chili paste. Bring to a boil, then reduce heat to medium-low.\n5. Cover and simmer, stirring occasionally, until the pasta is tender and the liquid is absorbed, about 15 minutes.\n6. Remove from heat and stir in the parmesan cheese. Serve topped with additional parmesan, basil, and ricotta if desired.", "notes": "hearty, veg-packed, freezes well", "added": "2026-06-03", "image": "https://www.skinnytaste.com/wp-content/uploads/2026/02/One-Pot-Turkey-Bolognese-19.jpg"}, {"name": "Harissa-Spiced Pasta with Chicken & Green Beans", "cuisine": "Italian", "protein": "chicken", "meal_type": "dinner", "effort": "medium", "url": "https://www.177milkstreet.com/recipes/harissa-spiced-pasta-chicken-tn-med", "ingredients": "1 1/2 pounds boneless, skinless chicken thighs, trimmed and cut into 1-inch pieces; 1 to 2 tablespoons harissa paste; kosher salt and ground black pepper; 3 tablespoons extra-virgin olive oil; 1/3 cup tomato paste; 1 medium yellow onion, chopped; 4 medium garlic cloves, minced; 3/4 teaspoon ground allspice; 1 pound medium pasta shells; 8 ounces green beans, trimmed and cut into 1-inch pieces; 3 cups boiling water; 1/2 cup finely chopped fresh mint or flat-leaf parsley", "instructions": "1. In a large bowl, combine the chicken, harissa, and 1/4 teaspoon salt. Heat the oil in a large Dutch oven over medium-high until barely smoking. Add the chicken and cook, stirring occasionally, until no longer pink on the surface, about 5 minutes. Return the chicken to the bowl with a slotted spoon.\n2. To the pot over medium, add the tomato paste and cook, stirring occasionally, until it begins to darken and stick to the bottom, 3 to 5 minutes. Add the onion and 1/4 teaspoon salt, cooking until softened, about 5 minutes. Stir in the garlic and allspice and cook until fragrant, about 30 seconds.\n3. Add the chicken with accumulated juices, the pasta, and the green beans, stirring well. Stir in the boiling water and 1 teaspoon salt. Bring to a boil over medium-high, cover and cook, stirring occasionally, until the pasta is al dente and the mixture is saucy. Taste and adjust seasoning with salt and pepper, then stir in the mint.", "notes": "North African meets Italian", "added": "2026-06-03", "image": "https://images.177milkstreet.com/production/edf2792bd916b30a9ab452a0a86543c5dbab3897-4176x2784.jpg?rect=0,296,4176,2192&amp;w=1200&amp;h=630&amp;q=80&amp;auto=format"}, {"name": "Grilled Lemon-Garlic Chicken Kebabs with Basil Chimichurri", "cuisine": "Italian", "protein": "chicken", "meal_type": "dinner", "effort": "quick", "url": "https://nerdswithknives.com/lemon-garlic-chicken-kebabs/", "ingredients": "2 pounds boneless skinless chicken thighs (or breasts); 1 pint large cherry tomatoes; 3 garlic cloves, grated or minced; 3 tablespoons olive oil; 1/2 teaspoon crushed red pepper flakes; zest from one lemon, finely grated; 1 tablespoon lemon juice; 1 teaspoon maple syrup or honey; 1 teaspoon coarse kosher salt; 1/2 teaspoon freshly ground black pepper; 1 1/4 cups fresh basil leaves; 1/4 cup fresh flat-leaf parsley; 1/3 cup extra-virgin olive oil; 2 tablespoons red wine vinegar; 1 small garlic clove, grated (1 teaspoon); kosher salt and freshly ground pepper to taste", "instructions": "1. Preheat the grill to medium-high heat; clean and oil the grates. Soak wooden skewers in warm water if using.\n2. In a large bowl, mix the garlic, 3 tablespoons olive oil, red pepper flakes, lemon zest and juice, maple syrup, salt, and pepper.\n3. Prick the chicken thighs all over with a fork, cut into two-inch chunks, and coat with the marinade for about five minutes.\n4. Meanwhile, pulse the basil, parsley, extra-virgin olive oil, red wine vinegar, and grated garlic in a food processor until coarsely chopped. Season to taste and let sit.\n5. Thread the chicken onto skewers with space between pieces; thread the tomatoes onto separate skewers and brush with oil and salt.\n6. Grill the chicken kebabs, turning occasionally, until charred and cooked through, about 10 minutes; grill the tomato skewers until lightly blistered.\n7. Transfer to a platter and serve with the basil chimichurri sauce.", "notes": "fresh, grill-friendly", "added": "2026-06-03", "image": "https://nerdswithknives.com/wp-content/uploads/2025/07/IMG_1859-4-scaled.jpg"}, {"name": "Butter Chicken", "cuisine": "Asian", "protein": "chicken", "meal_type": "dinner", "effort": "involved", "url": "https://www.recipetineats.com/butter-chicken/", "ingredients": "1.5lb/750g chicken thigh fillets, cut into bite-size pieces; 1/2 cup full fat plain yogurt; 1 tbsp lemon juice; 1 tsp turmeric powder; 2 tsp garam masala; 1/2 tsp chili powder or cayenne pepper; 1 tsp ground cumin; 1 tbsp fresh grated ginger; 2 cloves garlic, crushed; 2 tbsp (30g) ghee or butter (or 1 tbsp vegetable oil); 1 cup tomato passata; 1 cup heavy/thickened cream; 1 tbsp sugar; 1 1/4 tsp salt", "instructions": "1. Combine all the marinade ingredients with the chicken in a bowl. Cover and refrigerate overnight or for a minimum of 3 hours.\n2. Heat the ghee over high heat in a large fry pan. Add the chicken with the marinade clinging to it and cook for about 3 minutes until white throughout.\n3. Add the tomato passata, cream, sugar and salt, including any remaining marinade left in the bowl.\n4. Reduce heat to low and simmer for 20 minutes.\n5. Taste and adjust seasoning if needed.\n6. Garnish with cilantro if desired and serve with basmati rice.", "notes": "rich, mildly spiced", "added": "2026-06-03", "image": "https://www.recipetineats.com/tachyon/2019/01/Butter-Chicken_5.jpg"}, {"name": "Lemon Butter Chicken Breasts", "cuisine": "American", "protein": "chicken", "meal_type": "dinner", "effort": "quick", "url": "https://www.cookingclassy.com/lemon-butter-chicken/", "ingredients": "4 (5 oz) chicken breasts, pounded to 1/3-inch thickness; salt and freshly ground black pepper; 1/3 cup all-purpose flour; 1 tablespoon olive oil; 4 tablespoons unsalted butter, divided into 1 tablespoon pieces; 1 1/2 teaspoons minced garlic; 1/2 cup low-sodium chicken broth; 3 tablespoons fresh lemon juice; 1/2 teaspoon fresh lemon zest; 1 1/2 tablespoons minced fresh parsley (optional)", "instructions": "1. Season both sides of the chicken with salt and pepper.\n2. Place the flour in a shallow dish and dredge both sides of the chicken breasts.\n3. Heat a 12-inch skillet over medium-high heat.\n4. Add the olive oil and 1 tablespoon butter; once melted, add the chicken in a single layer.\n5. Sear until golden brown on the bottom, about 4-5 minutes, then flip and cook until the chicken reaches 165F internally, about 4-5 minutes longer.\n6. Transfer the chicken to a plate, leaving excess oil in the pan.\n7. Reduce heat to medium, add the garlic, and saute about 20 seconds until lightly golden.\n8. Pour in the chicken broth while scraping up the browned bits from the pan bottom.\n9. Add the lemon juice and bring to a simmer; reduce heat slightly and simmer until the liquid reduces by half, about 2 minutes.\n10. Stir in the remaining 3 tablespoons butter and the lemon zest until the butter melts.\n11. Return the chicken to the skillet, spoon the sauce over it, and garnish with parsley. Serve warm.", "notes": "bright, quick skillet", "added": "2026-06-03", "image": "https://www.cookingclassy.com/wp-content/uploads/2018/07/lemon-butter-chicken-18.jpg"}, {"name": "Swedish Meatballs", "cuisine": "American", "protein": "beef", "meal_type": "dinner", "effort": "involved", "url": "https://www.recipetineats.com/swedish-meatballs/", "ingredients": "2 slices white sandwich bread, crusts removed, chopped into small cubes; 1 small onion (brown, white or yellow); 300g (10 oz) ground beef; 300g (10 oz) ground pork; 1 egg; 1/4 teaspoon ground nutmeg; 1/4 teaspoon allspice powder; 1/4 teaspoon black pepper; 3/4 teaspoon salt; 1 tablespoon oil; 40g (3 tablespoons) unsalted butter; 3 tablespoons flour; 2 cups beef broth/stock (salt reduced); 1/2 cup heavy/thickened cream", "instructions": "1. Grate the onion using a box grater; scrape into a bowl with the bread and mix well until soggy. Soak for 1 minute.\n2. Add the remaining meatball ingredients except the oil; mix thoroughly.\n3. Using a tablespoon measure or ice cream scooper, dollop the mixture onto a work surface (25-30 portions), then roll into balls.\n4. Heat the oil in a skillet over medium-high heat. Brown half the meatballs on all sides, about 3 minutes, then remove to a plate. Brown the remaining batch.\n5. Pour off excess oil if needed and lower the heat to medium.\n6. Melt the butter in the skillet; add the flour and cook 1 minute, stirring.\n7. Gradually add the beef broth while stirring until smooth and simmering.\n8. Return the meatballs and pooled juices to the skillet; simmer 8-10 minutes until the gravy thickens, stirring occasionally.\n9. Add the cream and simmer 2 more minutes.\n10. Serve over mashed potatoes or noodles.", "notes": "beef + pork, over noodles or mash", "added": "2026-06-03", "image": "https://www.recipetineats.com/tachyon/2017/01/Swedish-Meatballs_8.jpg"}, {"name": "Scrambled Eggs & Toast", "cuisine": "American", "protein": "eggs", "meal_type": "breakfast", "effort": "quick", "url": "", "ingredients": "6 large eggs; 3 tbsp milk; 2 tbsp butter; salt and pepper to taste; 6 slices bread", "instructions": "1. Whisk the eggs with milk, salt and pepper.\n2. Melt butter in a nonstick skillet over medium-low heat.\n3. Pour in the eggs and gently stir with a spatula until softly set, 2-3 minutes.\n4. Meanwhile toast and butter the bread.\n5. Serve the eggs immediately with toast.", "notes": "5-min staple; pairs with fruit", "added": "2026-06-03", "image": ""}, {"name": "Greek Yogurt with Berries & Granola", "cuisine": "American", "protein": "dairy", "meal_type": "breakfast", "effort": "quick", "url": "", "ingredients": "3 cups plain or vanilla Greek yogurt; 1 1/2 cups mixed fresh berries; 3/4 cup granola; 3 tsp honey (optional)", "instructions": "1. Spoon 1 cup yogurt into each of 3 bowls.\n2. Top each with 1/2 cup berries and 1/4 cup granola.\n3. Drizzle with honey if desired and serve.", "notes": "no-cook; uses seasonal berries", "added": "2026-06-03", "image": ""}, {"name": "Overnight Oats", "cuisine": "American", "protein": "none", "meal_type": "breakfast", "effort": "quick", "url": "", "ingredients": "1 1/2 cups rolled oats; 1 1/2 cups milk (dairy or plant); 3/4 cup Greek yogurt; 3 tbsp chia seeds; 3 tsp honey or maple syrup; fruit for topping", "instructions": "1. Combine oats, milk, yogurt, chia seeds and sweetener in a jar or container.\n2. Stir well, cover, and refrigerate overnight (at least 4 hours).\n3. In the morning, stir, divide into 3 portions, and top with fruit.", "notes": "make-ahead jars; oats/milk/fruit", "added": "2026-06-03", "image": ""}, {"name": "Veggie & Cheese Egg Scramble", "cuisine": "American", "protein": "eggs", "meal_type": "breakfast", "effort": "quick", "url": "", "ingredients": "6 large eggs; 1 tbsp butter or oil; 1 cup chopped vegetables (bell pepper, spinach, onion, tomato); 1/2 cup shredded cheese; salt and pepper to taste", "instructions": "1. Heat butter in a skillet over medium heat.\n2. Add the chopped vegetables and saute until softened, 3-4 minutes.\n3. Whisk the eggs with salt and pepper and pour into the pan.\n4. Gently stir until the eggs are nearly set, then fold in the cheese.\n5. Cook until the cheese melts and the eggs are just set; serve.", "notes": "uses up leftover veg", "added": "2026-06-03", "image": ""}, {"name": "Avocado Toast with Fried Egg", "cuisine": "American", "protein": "eggs", "meal_type": "breakfast", "effort": "quick", "url": "", "ingredients": "6 slices hearty bread; 2 ripe avocados; 6 large eggs; 1 tbsp oil or butter; salt, pepper, and red pepper flakes to taste; 1/2 lemon (optional)", "instructions": "1. Toast the bread.\n2. Mash the avocado with a squeeze of lemon, salt and pepper; spread on the toast.\n3. Fry the eggs in oil or butter to desired doneness.\n4. Top each toast with a fried egg, season with salt, pepper and red pepper flakes, and serve.", "notes": "fast; avocado + egg + bread", "added": "2026-06-03", "image": ""}, {"name": "Weekend Pancakes", "cuisine": "American", "protein": "none", "meal_type": "breakfast", "effort": "medium", "url": "", "ingredients": "1 1/2 cups all-purpose flour; 3 1/2 tsp baking powder; 1 tsp salt; 1 tbsp sugar; 1 1/4 cups milk; 1 egg; 3 tbsp melted butter; butter and maple syrup for serving", "instructions": "1. Whisk together the flour, baking powder, salt and sugar.\n2. In another bowl whisk the milk, egg and melted butter.\n3. Combine wet and dry ingredients, stirring just until combined (lumps are fine).\n4. Heat a griddle over medium heat and lightly grease.\n5. Pour 1/4 cup batter per pancake; cook until bubbles form, then flip and cook until golden.\n6. Serve with butter and maple syrup.", "notes": "weekend treat; batch for 3", "added": "2026-06-03", "image": ""}, {"name": "Dinner Leftovers", "cuisine": "American", "protein": "varies", "meal_type": "lunch", "effort": "quick", "url": "", "ingredients": "", "instructions": "1. Reheat the prior night's dinner portion in the microwave or on the stovetop until hot.\n2. Refresh with a squeeze of lemon, fresh herbs, or a small side salad if desired.", "notes": "default lunch: reheat prior night's dinner; adds nothing to grocery list", "added": "2026-06-03", "image": ""}, {"name": "Turkey & Swiss Sandwiches", "cuisine": "American", "protein": "poultry", "meal_type": "lunch", "effort": "quick", "url": "", "ingredients": "6 slices bread; 12 oz sliced deli turkey; 6 slices Swiss cheese; lettuce leaves; 1 tomato, sliced; mayonnaise and mustard to taste", "instructions": "1. Spread mayonnaise and/or mustard on the bread.\n2. Layer turkey, Swiss, lettuce and tomato on 3 slices.\n3. Top with the remaining bread, halve, and serve.", "notes": "deli meat, cheese, bread, greens", "added": "2026-06-03", "image": ""}, {"name": "Big Green Salad with Grilled Chicken", "cuisine": "American", "protein": "chicken", "meal_type": "lunch", "effort": "quick", "url": "", "ingredients": "2 cooked chicken breasts (or leftover/rotisserie chicken), sliced; 8 cups mixed salad greens; 1 cucumber, sliced; 1 cup cherry tomatoes, halved; 1/2 red onion, thinly sliced; 1/2 cup shredded carrot; vinaigrette dressing", "instructions": "1. Divide the greens among 3 bowls or plates.\n2. Top with cucumber, tomatoes, onion and carrot.\n3. Add the sliced chicken.\n4. Drizzle with vinaigrette and serve.", "notes": "uses leftover/rotisserie chicken", "added": "2026-06-03", "image": ""}, {"name": "Hummus & Veggie Wrap", "cuisine": "Mediterranean", "protein": "none", "meal_type": "lunch", "effort": "quick", "url": "", "ingredients": "3 large flour tortillas or wraps; 3/4 cup hummus; 1 cucumber, sliced; 1 bell pepper, sliced; 1 cup shredded carrot; 1 1/2 cups baby spinach or greens; feta cheese (optional)", "instructions": "1. Spread 1/4 cup hummus over each wrap.\n2. Layer cucumber, bell pepper, carrot and greens down the center; add feta if using.\n3. Roll up tightly, halve, and serve.", "notes": "tortilla, hummus, crunchy veg", "added": "2026-06-03", "image": ""}, {"name": "Loaded Grain Bowl", "cuisine": "American", "protein": "varies", "meal_type": "lunch", "effort": "quick", "url": "", "ingredients": "3 cups cooked grains (rice, quinoa, or farro); 2 cups cooked or leftover protein (chicken, beef, beans); 2 cups chopped vegetables (roasted or raw); 1 avocado, sliced; sauce of choice (tahini, vinaigrette, or yogurt); salt and pepper to taste", "instructions": "1. Divide the cooked grains among 3 bowls.\n2. Top each with protein, vegetables and avocado.\n3. Drizzle with your chosen sauce, season, and serve.", "notes": "leftover grain + protein + veg + sauce", "added": "2026-06-03", "image": ""}, {"name": "Garlic Herb Chicken and Asparagus", "cuisine": "American", "protein": "chicken", "meal_type": "dinner", "effort": "quick", "url": "https://www.lecremedelacrumb.com/one-pan-garlic-herb-chicken-asparagus/", "ingredients": "3-6 boneless skinless chicken breasts (pounded to 1/2 inch) or chicken thighs; 1 lb asparagus, ends trimmed; 3 tbsp butter, divided; 1 tbsp minced garlic; 1/2 tsp dried basil; 1/2 tsp dried oregano; 1/2 tsp dried thyme; 1/2 tsp onion powder; salt and pepper to taste; fresh herbs for garnish (optional)", "instructions": "1. Season chicken with salt and pepper. Melt 2 tbsp butter in a large skillet over medium-high heat. Add garlic and dried herbs (basil, oregano, thyme, onion powder); cook about 1 minute until fragrant.\n2. Reduce heat to medium, add chicken, and cook 5-7 minutes per side until nearly cooked through.\n3. Push chicken to the sides and add the remaining 1 tbsp butter to the center. Once melted, add asparagus, season with salt and pepper, and cook 4-6 minutes, rotating, until asparagus is tender and chicken is cooked through.\n4. Serve immediately, garnished with fresh cracked pepper and fresh herbs if desired.", "notes": "One-pan weeknight chicken featuring in-season asparagus", "added": "2026-06-03", "image": "https://www.lecremedelacrumb.com/wp-content/uploads/2017/04/garlic-herb-chicken-asparagus-102.jpg"}, {"name": "BBQ-Rubbed Pork Chops with New Potatoes", "cuisine": "American", "protein": "pork", "meal_type": "dinner", "effort": "medium", "url": "https://www.recipetineats.com/oven-baked-pork-chops-with-potatoes/", "ingredients": "4 bone-in pork chops (200-250g / 7-9 oz each); 800g (1.75 lb) baby/new potatoes, halved if larger; 2 tbsp olive oil (1 for potatoes, 1 for rub); 2 tbsp ketchup; 2 tbsp brown sugar; 1 tbsp soy sauce; 1 tsp Worcestershire sauce; 2 tsp apple cider vinegar; 1 clove garlic, minced; salt and pepper", "instructions": "1. Preheat oven to 220C/430F (200C/390F fan-forced).\n2. Toss halved new potatoes in 1 tbsp olive oil with salt and pepper; spread on a baking tray.\n3. Bake potatoes for 15 minutes.\n4. Meanwhile, mix the rub: ketchup, brown sugar, soy sauce, Worcestershire, apple cider vinegar, minced garlic, and 1 tbsp olive oil.\n5. Coat pork chops on both sides with the rub, reserving some for basting.\n6. Remove tray from oven, push potatoes to the sides, and place pork chops on the tray.\n7. Bake for 15 minutes.\n8. Switch oven to broiler/grill on high; flip pork and brush with remaining rub.\n9. Broil 7-10 minutes until caramelized.\n10. Brush the golden pan juices over the pork and broil 2 more minutes.\n11. Serve pork and potatoes with pan juices drizzled over.", "notes": "BBQ-style rubbed pork chops roasted with in-season new potatoes on one tray", "added": "2026-06-03", "image": "https://www.recipetineats.com/tachyon/2016/09/Baked-Pork-Chops_2.jpg"}, {"name": "Huli Huli Chicken", "cuisine": "Hawaiian", "protein": "chicken", "meal_type": "dinner", "effort": "involved", "url": "https://www.recipetineats.com/huli-huli-chicken-hawaiian/", "ingredients": "3 lb (1.5 kg) chicken thighs; 1 tbsp vegetable oil; 3/4 cup canned/bottled unsweetened pineapple juice (not fresh); 1 1/2 tbsp freshly grated ginger; 1 1/2 tbsp freshly grated garlic; 1/2 cup tomato ketchup; 1/2 cup soy sauce; 1/4 cup sherry or Chinese cooking wine; 1/4 cup brown sugar; 1 tbsp Sriracha; 2 tbsp rice vinegar (or cider vinegar); 1 tbsp toasted sesame oil; sliced green onion (garnish, optional); pineapple slices, grilled (garnish, optional)", "instructions": "1. Mix all marinade ingredients together. Reserve 3/4 cup for basting.\n2. Place chicken in a glass or ceramic container, coat with the remaining marinade, and refrigerate 24-48 hours.\n3. Preheat BBQ to medium-high, or heat 1 tbsp vegetable oil in a skillet over medium-high.\n4. Cook the first side 2-3 minutes until golden, then flip and cook 2 minutes.\n5. Baste generously with the reserved marinade, flip, and cook 1 minute.\n6. Repeat the baste-and-flip cycle every minute for about 10 minutes total, until the internal temperature reaches 167F (75C) for thighs.\n7. Rest 3 minutes before serving. Garnish with sliced green onion and grilled pineapple if desired.", "notes": "Hawaiian grilled BBQ chicken thighs in a sweet-savory pineapple-soy-ginger marinade; needs 24-48 hr marinate", "added": "2026-06-03", "image": "https://www.recipetineats.com/tachyon/2020/07/Hawaiian-Huli-Huli-Chicken_1.jpg"}, {"name": "Tuna Melt", "cuisine": "American", "protein": "seafood", "meal_type": "lunch", "effort": "quick", "url": "", "ingredients": "2 (5 oz) cans tuna, drained; 1/3 cup mayonnaise; 1 stalk celery, finely diced; 2 tbsp red onion, minced; 1 tsp lemon juice; salt and pepper; 6 slices bread; 6 slices cheddar or Swiss cheese; 2 tbsp butter (for grilling)", "instructions": "1. Mix tuna, mayo, celery, red onion, lemon juice, salt and pepper.\n2. Spread tuna salad on 3 slices of bread; top each with cheese and a second slice.\n3. Butter the outsides and grill in a skillet over medium heat until golden and the cheese melts, 2-3 min per side.\n4. Slice and serve warm.", "notes": "classic tuna melt; quick lunch", "added": "2026-06-03", "image": ""}, {"name": "Ham & Swiss Melt", "cuisine": "American", "protein": "pork", "meal_type": "lunch", "effort": "quick", "url": "", "ingredients": "6 slices bread; 9 oz sliced deli ham; 6 slices Swiss cheese; 2 tbsp Dijon mustard; 2 tbsp butter, softened", "instructions": "1. Spread Dijon on 3 slices of bread.\n2. Layer ham and Swiss, top with the remaining bread.\n3. Butter the outsides and grill in a skillet over medium heat until golden and the cheese melts, 2-3 min per side.\n4. Slice and serve.", "notes": "grilled ham & Swiss melt", "added": "2026-06-03", "image": ""}, {"name": "Grilled Cheese & Tomato Soup", "cuisine": "American", "protein": "none", "meal_type": "lunch", "effort": "quick", "url": "", "ingredients": "6 slices bread; 6 slices cheddar cheese (or 1 1/2 cups shredded); 3 tbsp butter, softened; 1 (24 oz) carton tomato soup", "instructions": "1. Heat the tomato soup in a saucepan over medium until hot.\n2. Butter the outsides of the bread and assemble with cheese in the middle.\n3. Grill in a skillet over medium heat until golden and the cheese melts, 2-3 min per side.\n4. Slice and serve with bowls of warm tomato soup.", "notes": "comfort combo; quick", "added": "2026-06-03", "image": ""}], "menu": [{"day": "Monday", "meal": "breakfast", "name": "Scrambled Eggs & Toast", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "6 large eggs; 3 tbsp milk; 2 tbsp butter; salt and pepper to taste; 6 slices bread", "instructions": "1. Whisk the eggs with milk, salt and pepper.\n2. Melt butter in a nonstick skillet over medium-low heat.\n3. Pour in the eggs and gently stir with a spatula until softly set, 2-3 minutes.\n4. Meanwhile toast and butter the bread.\n5. Serve the eggs immediately with toast.", "url": "", "source": "pool"}, {"day": "Monday", "meal": "lunch", "name": "Turkey & Swiss Sandwiches", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "6 slices bread; 12 oz sliced deli turkey; 6 slices Swiss cheese; lettuce leaves; 1 tomato, sliced; mayonnaise and mustard to taste", "instructions": "1. Spread mayonnaise and/or mustard on the bread.\n2. Layer turkey, Swiss, lettuce and tomato on 3 slices.\n3. Top with the remaining bread, halve, and serve.", "url": "", "source": "pool"}, {"day": "Monday", "meal": "dinner", "name": "Garlic Herb Chicken and Asparagus", "image": "https://www.lecremedelacrumb.com/wp-content/uploads/2017/04/garlic-herb-chicken-asparagus-102.jpg", "cuisine": "American", "effort": "quick", "ingredients": "3-6 boneless skinless chicken breasts (pounded to 1/2 inch) or chicken thighs; 1 lb asparagus, ends trimmed; 3 tbsp butter, divided; 1 tbsp minced garlic; 1/2 tsp dried basil; 1/2 tsp dried oregano; 1/2 tsp dried thyme; 1/2 tsp onion powder; salt and pepper to taste; fresh herbs for garnish (optional)", "instructions": "1. Season chicken with salt and pepper. Melt 2 tbsp butter in a large skillet over medium-high heat. Add garlic and dried herbs (basil, oregano, thyme, onion powder); cook about 1 minute until fragrant.\n2. Reduce heat to medium, add chicken, and cook 5-7 minutes per side until nearly cooked through.\n3. Push chicken to the sides and add the remaining 1 tbsp butter to the center. Once melted, add asparagus, season with salt and pepper, and cook 4-6 minutes, rotating, until asparagus is tender and chicken is cooked through.\n4. Serve immediately, garnished with fresh cracked pepper and fresh herbs if desired.", "url": "https://www.lecremedelacrumb.com/one-pan-garlic-herb-chicken-asparagus/", "source": "new"}, {"day": "Tuesday", "meal": "breakfast", "name": "Greek Yogurt with Berries & Granola", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "3 cups plain or vanilla Greek yogurt; 1 1/2 cups mixed fresh berries; 3/4 cup granola; 3 tsp honey (optional)", "instructions": "1. Spoon 1 cup yogurt into each of 3 bowls.\n2. Top each with 1/2 cup berries and 1/4 cup granola.\n3. Drizzle with honey if desired and serve.", "url": "", "source": "pool"}, {"day": "Tuesday", "meal": "lunch", "name": "Tuna Melt", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "2 (5 oz) cans tuna, drained; 1/3 cup mayonnaise; 1 stalk celery, finely diced; 2 tbsp red onion, minced; 1 tsp lemon juice; salt and pepper; 6 slices bread; 6 slices cheddar or Swiss cheese; 2 tbsp butter (for grilling)", "instructions": "1. Mix tuna, mayo, celery, red onion, lemon juice, salt and pepper.\n2. Spread tuna salad on 3 slices of bread; top each with cheese and a second slice.\n3. Butter the outsides and grill in a skillet over medium heat until golden and the cheese melts, 2-3 min per side.\n4. Slice and serve warm.", "url": "", "source": "new"}, {"day": "Tuesday", "meal": "dinner", "name": "Hamburger Steak with Onion Gravy", "image": "https://www.restlesschipotle.com/wp-content/uploads/2022/03/hamburger-steak-feat.jpg", "cuisine": "American", "effort": "quick", "ingredients": "2 lb lean ground beef; 1 egg; 1/4 cup Worcestershire sauce; 1/3 cup breadcrumbs; 1/3 cup milk; 1 tsp seasoned salt; 1 tsp onion powder; 2 tsp garlic powder; 1 onion, sliced; 1/4 cup butter; 1/3 cup all-purpose flour; 2 cups beef broth", "instructions": "1. Combine all patty ingredients (ground beef, egg, Worcestershire, breadcrumbs, milk, seasoned salt, onion powder, garlic powder) in a bowl and mix thoroughly by hand.\n2. Form the mixture into 6 patties.\n3. Spray a heavy skillet with nonstick cooking spray.\n4. Brown each patty over medium-high heat for about 3 minutes per side.\n5. Remove the patties and set aside.\n6. Add the sliced onions to the same pan, with extra oil if needed.\n7. Saute until the onions begin to brown.\n8. Add the butter and let it melt.\n9. Whisk in the flour until no longer visible.\n10. Cook while whisking constantly for 1 minute.\n11. Whisk in the beef broth until no lumps remain.\n12. Bring to a simmer, whisking until thickened.\n13. Taste and adjust seasoning as needed.\n14. Return the beef patties to the gravy.\n15. Set heat to medium-low, cover, and simmer 20-30 minutes until the patties reach 160F internally.\n16. Remove from heat, cover, and let stand 5-10 minutes before serving.", "url": "https://www.restlesschipotle.com/hamburger-steak/", "source": "pool"}, {"day": "Wednesday", "meal": "breakfast", "name": "Overnight Oats", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "1 1/2 cups rolled oats; 1 1/2 cups milk (dairy or plant); 3/4 cup Greek yogurt; 3 tbsp chia seeds; 3 tsp honey or maple syrup; fruit for topping", "instructions": "1. Combine oats, milk, yogurt, chia seeds and sweetener in a jar or container.\n2. Stir well, cover, and refrigerate overnight (at least 4 hours).\n3. In the morning, stir, divide into 3 portions, and top with fruit.", "url": "", "source": "pool"}, {"day": "Wednesday", "meal": "lunch", "name": "Dinner Leftovers", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "", "instructions": "1. Reheat the prior night's dinner portion in the microwave or on the stovetop until hot.\n2. Refresh with a squeeze of lemon, fresh herbs, or a small side salad if desired.", "url": "", "source": "pool"}, {"day": "Wednesday", "meal": "dinner", "name": "BBQ-Rubbed Pork Chops with New Potatoes", "image": "https://www.recipetineats.com/tachyon/2016/09/Baked-Pork-Chops_2.jpg", "cuisine": "American", "effort": "medium", "ingredients": "4 bone-in pork chops (200-250g / 7-9 oz each); 800g (1.75 lb) baby/new potatoes, halved if larger; 2 tbsp olive oil (1 for potatoes, 1 for rub); 2 tbsp ketchup; 2 tbsp brown sugar; 1 tbsp soy sauce; 1 tsp Worcestershire sauce; 2 tsp apple cider vinegar; 1 clove garlic, minced; salt and pepper", "instructions": "1. Preheat oven to 220C/430F (200C/390F fan-forced).\n2. Toss halved new potatoes in 1 tbsp olive oil with salt and pepper; spread on a baking tray.\n3. Bake potatoes for 15 minutes.\n4. Meanwhile, mix the rub: ketchup, brown sugar, soy sauce, Worcestershire, apple cider vinegar, minced garlic, and 1 tbsp olive oil.\n5. Coat pork chops on both sides with the rub, reserving some for basting.\n6. Remove tray from oven, push potatoes to the sides, and place pork chops on the tray.\n7. Bake for 15 minutes.\n8. Switch oven to broiler/grill on high; flip pork and brush with remaining rub.\n9. Broil 7-10 minutes until caramelized.\n10. Brush the golden pan juices over the pork and broil 2 more minutes.\n11. Serve pork and potatoes with pan juices drizzled over.", "url": "https://www.recipetineats.com/oven-baked-pork-chops-with-potatoes/", "source": "new"}, {"day": "Thursday", "meal": "breakfast", "name": "Veggie & Cheese Egg Scramble", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "6 large eggs; 1 tbsp butter or oil; 1 cup chopped vegetables (bell pepper, spinach, onion, tomato); 1/2 cup shredded cheese; salt and pepper to taste", "instructions": "1. Heat butter in a skillet over medium heat.\n2. Add the chopped vegetables and saute until softened, 3-4 minutes.\n3. Whisk the eggs with salt and pepper and pour into the pan.\n4. Gently stir until the eggs are nearly set, then fold in the cheese.\n5. Cook until the cheese melts and the eggs are just set; serve.", "url": "", "source": "pool"}, {"day": "Thursday", "meal": "lunch", "name": "Ham & Swiss Melt", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "6 slices bread; 9 oz sliced deli ham; 6 slices Swiss cheese; 2 tbsp Dijon mustard; 2 tbsp butter, softened", "instructions": "1. Spread Dijon on 3 slices of bread.\n2. Layer ham and Swiss, top with the remaining bread.\n3. Butter the outsides and grill in a skillet over medium heat until golden and the cheese melts, 2-3 min per side.\n4. Slice and serve.", "url": "", "source": "new"}, {"day": "Thursday", "meal": "dinner", "name": "Lemon Butter Chicken Breasts", "image": "https://www.cookingclassy.com/wp-content/uploads/2018/07/lemon-butter-chicken-18.jpg", "cuisine": "American", "effort": "quick", "ingredients": "4 (5 oz) chicken breasts, pounded to 1/3-inch thickness; salt and freshly ground black pepper; 1/3 cup all-purpose flour; 1 tablespoon olive oil; 4 tablespoons unsalted butter, divided into 1 tablespoon pieces; 1 1/2 teaspoons minced garlic; 1/2 cup low-sodium chicken broth; 3 tablespoons fresh lemon juice; 1/2 teaspoon fresh lemon zest; 1 1/2 tablespoons minced fresh parsley (optional)", "instructions": "1. Season both sides of the chicken with salt and pepper.\n2. Place the flour in a shallow dish and dredge both sides of the chicken breasts.\n3. Heat a 12-inch skillet over medium-high heat.\n4. Add the olive oil and 1 tablespoon butter; once melted, add the chicken in a single layer.\n5. Sear until golden brown on the bottom, about 4-5 minutes, then flip and cook until the chicken reaches 165F internally, about 4-5 minutes longer.\n6. Transfer the chicken to a plate, leaving excess oil in the pan.\n7. Reduce heat to medium, add the garlic, and saute about 20 seconds until lightly golden.\n8. Pour in the chicken broth while scraping up the browned bits from the pan bottom.\n9. Add the lemon juice and bring to a simmer; reduce heat slightly and simmer until the liquid reduces by half, about 2 minutes.\n10. Stir in the remaining 3 tablespoons butter and the lemon zest until the butter melts.\n11. Return the chicken to the skillet, spoon the sauce over it, and garnish with parsley. Serve warm.", "url": "https://www.cookingclassy.com/lemon-butter-chicken/", "source": "pool"}, {"day": "Friday", "meal": "breakfast", "name": "Avocado Toast with Fried Egg", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "6 slices hearty bread; 2 ripe avocados; 6 large eggs; 1 tbsp oil or butter; salt, pepper, and red pepper flakes to taste; 1/2 lemon (optional)", "instructions": "1. Toast the bread.\n2. Mash the avocado with a squeeze of lemon, salt and pepper; spread on the toast.\n3. Fry the eggs in oil or butter to desired doneness.\n4. Top each toast with a fried egg, season with salt, pepper and red pepper flakes, and serve.", "url": "", "source": "pool"}, {"day": "Friday", "meal": "lunch", "name": "Big Green Salad with Grilled Chicken", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "2 cooked chicken breasts (or leftover/rotisserie chicken), sliced; 8 cups mixed salad greens; 1 cucumber, sliced; 1 cup cherry tomatoes, halved; 1/2 red onion, thinly sliced; 1/2 cup shredded carrot; vinaigrette dressing", "instructions": "1. Divide the greens among 3 bowls or plates.\n2. Top with cucumber, tomatoes, onion and carrot.\n3. Add the sliced chicken.\n4. Drizzle with vinaigrette and serve.", "url": "", "source": "pool"}, {"day": "Friday", "meal": "dinner", "name": "Garlic Herb Butter Grilled Steak", "image": "https://cafedelites.com/wp-content/uploads/2020/06/Grilled-Steak-Browned-Butter-Sauce-IMAGE-41.jpg", "cuisine": "American", "effort": "quick", "ingredients": "4 steaks (ribeye, strip, porterhouse, T-bone, rump, sirloin, or eye fillet); 1/2 cup unsalted butter; 6-8 cloves garlic, smashed; 2 sprigs fresh herbs (thyme or rosemary); 1/2-1 tsp cracked pepper; salt to taste; pepper to taste; 2 tbsp cooking oil (canola recommended)", "instructions": "1. Remove the steaks from the refrigerator 15-30 minutes before grilling and cover with wrap or foil.\n2. Melt the butter in a small pot or skillet on the grill over medium-high heat, stirring continuously to prevent splattering.\n3. When the butter foams and turns golden brown with a nutty aroma, remove from heat immediately.\n4. Add the smashed garlic cloves, herb sprigs, pepper, and salt; mix lightly to brown the garlic and incorporate the browned bits.\n5. Cover and set the browned butter aside to absorb the garlic and herb flavors.\n6. Heat the grill over high heat and lightly grease the grill plates with oil; pat the steaks dry, brush with oil, and season generously with salt and pepper.\n7. Grill the steaks 4-5 minutes per side until browned and cooked to desired doneness, spooning browned butter over them during cooking.\n8. Transfer the steaks to a warm plate and rest 5 minutes, then serve with the remaining browned butter drizzled over top.", "url": "https://cafedelites.com/grilling-steak/", "source": "pool"}, {"day": "Saturday", "meal": "breakfast", "name": "Weekend Pancakes", "image": "", "cuisine": "American", "effort": "medium", "ingredients": "1 1/2 cups all-purpose flour; 3 1/2 tsp baking powder; 1 tsp salt; 1 tbsp sugar; 1 1/4 cups milk; 1 egg; 3 tbsp melted butter; butter and maple syrup for serving", "instructions": "1. Whisk together the flour, baking powder, salt and sugar.\n2. In another bowl whisk the milk, egg and melted butter.\n3. Combine wet and dry ingredients, stirring just until combined (lumps are fine).\n4. Heat a griddle over medium heat and lightly grease.\n5. Pour 1/4 cup batter per pancake; cook until bubbles form, then flip and cook until golden.\n6. Serve with butter and maple syrup.", "url": "", "source": "pool"}, {"day": "Saturday", "meal": "lunch", "name": "Grilled Cheese & Tomato Soup", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "6 slices bread; 6 slices cheddar cheese (or 1 1/2 cups shredded); 3 tbsp butter, softened; 1 (24 oz) carton tomato soup", "instructions": "1. Heat the tomato soup in a saucepan over medium until hot.\n2. Butter the outsides of the bread and assemble with cheese in the middle.\n3. Grill in a skillet over medium heat until golden and the cheese melts, 2-3 min per side.\n4. Slice and serve with bowls of warm tomato soup.", "url": "", "source": "new"}, {"day": "Saturday", "meal": "dinner", "name": "Huli Huli Chicken", "image": "https://www.recipetineats.com/tachyon/2020/07/Hawaiian-Huli-Huli-Chicken_1.jpg", "cuisine": "Hawaiian", "effort": "involved", "ingredients": "3 lb (1.5 kg) chicken thighs; 1 tbsp vegetable oil; 3/4 cup canned/bottled unsweetened pineapple juice (not fresh); 1 1/2 tbsp freshly grated ginger; 1 1/2 tbsp freshly grated garlic; 1/2 cup tomato ketchup; 1/2 cup soy sauce; 1/4 cup sherry or Chinese cooking wine; 1/4 cup brown sugar; 1 tbsp Sriracha; 2 tbsp rice vinegar (or cider vinegar); 1 tbsp toasted sesame oil; sliced green onion (garnish, optional); pineapple slices, grilled (garnish, optional)", "instructions": "1. Mix all marinade ingredients together. Reserve 3/4 cup for basting.\n2. Place chicken in a glass or ceramic container, coat with the remaining marinade, and refrigerate 24-48 hours.\n3. Preheat BBQ to medium-high, or heat 1 tbsp vegetable oil in a skillet over medium-high.\n4. Cook the first side 2-3 minutes until golden, then flip and cook 2 minutes.\n5. Baste generously with the reserved marinade, flip, and cook 1 minute.\n6. Repeat the baste-and-flip cycle every minute for about 10 minutes total, until the internal temperature reaches 167F (75C) for thighs.\n7. Rest 3 minutes before serving. Garnish with sliced green onion and grilled pineapple if desired.", "url": "https://www.recipetineats.com/huli-huli-chicken-hawaiian/", "source": "new"}, {"day": "Sunday", "meal": "breakfast", "name": "Greek Yogurt with Berries & Granola", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "3 cups plain or vanilla Greek yogurt; 1 1/2 cups mixed fresh berries; 3/4 cup granola; 3 tsp honey (optional)", "instructions": "1. Spoon 1 cup yogurt into each of 3 bowls.\n2. Top each with 1/2 cup berries and 1/4 cup granola.\n3. Drizzle with honey if desired and serve.", "url": "", "source": "pool"}, {"day": "Sunday", "meal": "lunch", "name": "Dinner Leftovers", "image": "", "cuisine": "American", "effort": "quick", "ingredients": "", "instructions": "1. Reheat the prior night's dinner portion in the microwave or on the stovetop until hot.\n2. Refresh with a squeeze of lemon, fresh herbs, or a small side salad if desired.", "url": "", "source": "pool"}, {"day": "Sunday", "meal": "dinner", "name": "Sheet-Pan Balsamic Rosemary Chicken Thighs & Potatoes", "image": "https://recipeteacher.com/wp-content/uploads/2018/10/sheet-pan-balsamic-rosemary-chicken-quarters.jpg", "cuisine": "American", "effort": "quick", "ingredients": "4 chicken quarters; 4 sprigs fresh rosemary; 1/2 cup balsamic vinegar; 1/4 cup chicken stock; 1 tbsp malt vinegar; 1 tbsp brown sugar; 1 tbsp fresh rosemary, chopped; 1 tbsp flat leaf parsley, chopped; 1 tbsp olive oil; salt to taste; 6 small/medium russet potatoes; 3 tbsp fresh chopped rosemary; 2 tbsp balsamic vinegar; 2 tbsp olive oil; 2 tbsp minced garlic; 2 tbsp chopped flat leaf parsley; 1 tsp onion powder; 1 tsp garlic powder; salt and pepper to taste", "instructions": "1. Preheat oven to 425F.\n2. Line a large baking sheet with foil or parchment paper.\n3. Arrange chicken quarters on the sheet, tuck a rosemary sprig under the skin of each quarter, and brush with olive oil and salt.\n4. Peel the potatoes and cut into wedges.\n5. Mix all potato ingredients in a bowl and coat the wedges thoroughly, then arrange on the sheet pan around the chicken; bake 40 minutes.\n6. Combine the remaining chicken ingredients (balsamic vinegar, chicken stock, malt vinegar, brown sugar, chopped rosemary, parsley, olive oil) in a small pot and simmer over low heat.\n7. At the 20-minute mark, remove the pan and brush the chicken with the balsamic mixture, then return to the oven.\n8. After 40 minutes total, remove the pan, cool 5 minutes, and drizzle the remaining sauce over the chicken before serving.", "url": "https://recipeteacher.com/sheet-pan-chicken-quarters-and-potatoes-rosemary-balsamic/", "source": "pool"}], "grocery": {"Produce": ["1 lb asparagus (Mon dinner; reuse extra in Thu scramble)", "1.25 lb baby/new potatoes (Wed pork chops)", "4 russet potatoes (Sun sheet-pan chicken)", "3 yellow onions", "1 red onion", "2 heads garlic", "1 knob fresh ginger (only Huli Huli)", "4 lemons", "1 bunch green onions", "2 avocados (Fri breakfast)", "1 large tub mixed salad greens (Fri salad + sandwich lettuce)", "2 tomatoes (sandwiches/scramble)", "1 cup cherry tomatoes (Fri salad)", "1 cucumber (Fri salad)", "2 carrots (Fri salad)", "1 bell pepper (Thu scramble)", "1 small bunch celery (only Tue tuna melt)", "2 lb strawberries or mixed berries (seasonal; Tue & Sun breakfast)", "1 pack fresh rosemary (Fri steak + Sun chicken)", "1 pack fresh thyme (Fri steak)", "1 bunch fresh parsley (Thu + Sun)"], "Meat & Seafood": ["~2.5 lb boneless skinless chicken breasts (Mon + Thu dinners + Fri salad)", "~3 lb boneless skinless chicken thighs (Sat Huli Huli + Sun sheet-pan)", "1.75 lb lean ground beef (Tue dinner + Wed leftover lunch)", "3 steaks, ~1.5 lb total (ribeye/strip/sirloin; Fri)", "3 bone-in pork chops, ~1.25 lb (Wed)", "12 oz sliced deli turkey (Mon sandwiches)", "9 oz sliced deli ham (only Thu melt)"], "Dairy & Eggs": ["2 dozen eggs", "1 lb butter", "1/2 gallon milk", "32 oz Greek yogurt", "1 pack sliced Swiss cheese (~12 slices; turkey sandwich + ham melt)", "1 pack sliced cheddar (grilled cheese + tuna melt + Thu scramble)"], "Pantry & Dry Goods": ["2 (5 oz) cans tuna (only Tue melt)", "1 (24 oz) carton tomato soup (only Sat lunch)", "1 can/bottle unsweetened pineapple juice (only Huli Huli)", "1 small bag granola — PEANUT-FREE (Tue & Sun yogurt)", "rolled oats (Wed overnight oats)", "chia seeds (small; only overnight oats)", "plain breadcrumbs (Tue hamburger steak)", "1 carton beef broth (Tue gravy)", "1 carton chicken stock/broth (Thu + Sun)", "jasmine or white rice (Huli Huli + Tue loco-moco option)"], "Bakery": ["2 loaves sandwich bread (toast, avocado toast, all sandwiches/melts)"], "Condiments & Sauces": ["ketchup (pork chops + Huli Huli)", "soy sauce (pork chops + Huli Huli)", "Worcestershire sauce (hamburger steak + pork chops)", "balsamic vinegar (Sun sheet-pan chicken)", "apple cider vinegar (pork chops; can also sub for malt/rice vinegar)", "rice vinegar (Huli Huli; or use cider)", "Sriracha (only Huli Huli; mild amount)", "toasted sesame oil (only Huli Huli)", "sherry or Chinese cooking wine (only Huli Huli)", "mayonnaise (tuna melt + turkey sandwich)", "Dijon mustard (ham melt + sandwiches)", "vinaigrette dressing (Fri salad)", "maple syrup (Sat pancakes)", "honey (overnight oats)", "brown sugar (pork chops + Huli Huli)"], "Spices": ["common dried herbs & spices assumed on hand: basil, oregano, thyme, onion powder, garlic powder, seasoned salt, paprika, salt, pepper"]}};</script>
